<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030b18"/>
      <stop offset="50%" stop-color="#06172d"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#041428" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#uiBg)"/>

  <!-- Top Figma-style UI Toolbar -->
  <rect x="30" y="25" width="1140" height="50" rx="12" fill="#04162e" stroke="#0e375e" stroke-width="1.5"/>
  <g transform="translate(50, 40)">
    <!-- Tool icons -->
    <rect x="0" y="0" width="20" height="20" rx="4" fill="#38bdf8"/>
    <text x="35" y="16" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Design System &amp; UI/UX Project</text>
    <text x="260" y="15" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Page: Final Web &amp; Mobile Flows</text>
    
    <rect x="750" y="-3" width="70" height="26" rx="6" fill="#0b2c52" stroke="#1d4e80" stroke-width="1"/>
    <text x="785" y="14" fill="#93c5fd" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Share</text>

    <rect x="830" y="-3" width="90" height="26" rx="6" fill="url(#purpleCyan)"/>
    <text x="875" y="14" fill="#020813" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Present ▶</text>
  </g>

  <!-- Design Canvas Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <circle cx="280" cy="360" r="180" fill="none" stroke-dasharray="6,6"/>
    <circle cx="920" cy="360" r="180" fill="none" stroke-dasharray="6,6"/>
  </g>

  <!-- Left Frame: Desktop UI Layout Mockup -->
  <g transform="translate(60, 105)">
    <rect x="0" y="0" width="480" height="510" rx="16" fill="url(#panelGrad)" stroke="#164e85" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="25" y="35" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">Desktop Web Interface (1440px)</text>
    <text x="25" y="55" fill="#64748b" font-family="'Outfit', sans-serif" font-size="11">Wireframe &amp; High-Fidelity Prototype</text>

    <!-- Navbar mockup -->
    <rect x="25" y="75" width="430" height="32" rx="8" fill="#020b17" stroke="#0e375e" stroke-width="1"/>
    <rect x="40" y="86" width="35" height="10" rx="3" fill="#38bdf8"/>
    <rect x="180" y="88" width="30" height="6" rx="2" fill="#475569"/>
    <rect x="225" y="88" width="30" height="6" rx="2" fill="#475569"/>
    <rect x="270" y="88" width="30" height="6" rx="2" fill="#475569"/>
    <rect x="405" y="83" width="38" height="16" rx="4" fill="#0284c7"/>

    <!-- Hero Card inside Desktop -->
    <rect x="25" y="120" width="430" height="160" rx="12" fill="#031024" stroke="#0e375e" stroke-width="1"/>
    <rect x="45" y="145" width="160" height="18" rx="4" fill="url(#purpleCyan)"/>
    <rect x="45" y="172" width="220" height="8" rx="3" fill="#334155"/>
    <rect x="45" y="186" width="180" height="8" rx="3" fill="#334155"/>
    <rect x="45" y="210" width="90" height="26" rx="6" fill="#0284c7"/>
    <rect x="145" y="210" width="90" height="26" rx="6" fill="#0f2b4c" stroke="#1d4e80" stroke-width="1"/>
    
    <!-- Hero Illustration / 3D Element Graphic -->
    <circle cx="360" cy="195" r="45" fill="#38bdf8" opacity="0.2"/>
    <polygon points="360,160 395,215 325,215" fill="#2dd4bf" opacity="0.6"/>

    <!-- 3 Cards below Hero -->
    <rect x="25" y="300" width="135" height="180" rx="10" fill="#020e1e" stroke="#0e375e" stroke-width="1"/>
    <circle cx="50" cy="330" r="14" fill="#0284c7" opacity="0.4"/>
    <rect x="40" y="360" width="90" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="40" y="378" width="105" height="6" rx="2" fill="#475569"/>
    <rect x="40" y="390" width="80" height="6" rx="2" fill="#475569"/>

    <rect x="172" y="300" width="135" height="180" rx="10" fill="#020e1e" stroke="#0e375e" stroke-width="1"/>
    <circle cx="197" cy="330" r="14" fill="#38bdf8" opacity="0.4"/>
    <rect x="187" y="360" width="90" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="187" y="378" width="105" height="6" rx="2" fill="#475569"/>
    <rect x="187" y="390" width="80" height="6" rx="2" fill="#475569"/>

    <rect x="320" y="300" width="135" height="180" rx="10" fill="#020e1e" stroke="#0e375e" stroke-width="1"/>
    <circle cx="345" cy="330" r="14" fill="#2dd4bf" opacity="0.4"/>
    <rect x="335" y="360" width="90" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="335" y="378" width="105" height="6" rx="2" fill="#475569"/>
    <rect x="335" y="390" width="80" height="6" rx="2" fill="#475569"/>
  </g>

  <!-- Middle Frame: Mobile Responsive Mockup -->
  <g transform="translate(570, 105)">
    <rect x="0" y="0" width="230" height="510" rx="28" fill="#020d1c" stroke="#1e4e80" stroke-width="2.5"/>
    <rect x="75" y="10" width="80" height="16" rx="8" fill="#000000"/>
    <circle cx="135" cy="18" r="3" fill="#1e293b"/>

    <text x="25" y="60" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">Mobile Flow (375px)</text>
    
    <rect x="15" y="80" width="200" height="110" rx="12" fill="url(#panelGrad)" stroke="#0e375e" stroke-width="1"/>
    <rect x="25" y="98" width="110" height="12" rx="3" fill="#e2e8f0"/>
    <rect x="25" y="118" width="150" height="6" rx="2" fill="#475569"/>
    <rect x="25" y="130" width="130" height="6" rx="2" fill="#475569"/>
    <rect x="25" y="150" width="75" height="24" rx="6" fill="url(#purpleCyan)"/>

    <!-- Mobile list items -->
    <rect x="15" y="205" width="200" height="55" rx="10" fill="#031427" stroke="#0e375e" stroke-width="1"/>
    <circle cx="35" cy="232" r="12" fill="#0284c7"/>
    <rect x="60" y="222" width="90" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="60" y="236" width="60" height="6" rx="2" fill="#475569"/>

    <rect x="15" y="270" width="200" height="55" rx="10" fill="#031427" stroke="#0e375e" stroke-width="1"/>
    <circle cx="35" cy="297" r="12" fill="#38bdf8"/>
    <rect x="60" y="287" width="90" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="60" y="301" width="60" height="6" rx="2" fill="#475569"/>

    <rect x="15" y="335" width="200" height="55" rx="10" fill="#031427" stroke="#0e375e" stroke-width="1"/>
    <circle cx="35" cy="362" r="12" fill="#2dd4bf"/>
    <rect x="60" y="352" width="90" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="60" y="366" width="60" height="6" rx="2" fill="#475569"/>

    <!-- Bottom Nav Bar -->
    <rect x="15" y="445" width="200" height="45" rx="20" fill="#041933" stroke="#1d4e80" stroke-width="1"/>
    <circle cx="45" cy="467" r="6" fill="#38bdf8"/>
    <circle cx="95" cy="467" r="6" fill="#64748b"/>
    <circle cx="145" cy="467" r="6" fill="#64748b"/>
    <circle cx="185" cy="467" r="6" fill="#64748b"/>
  </g>

  <!-- Right Frame: Design System Tokens & Components -->
  <g transform="translate(830, 105)">
    <rect x="0" y="0" width="310" height="510" rx="16" fill="url(#panelGrad)" stroke="#164e85" stroke-width="1.5"/>

    <text x="25" y="35" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">Design System Tokens</text>
    <text x="25" y="55" fill="#64748b" font-family="'Outfit', sans-serif" font-size="11">Color Palette, Typography &amp; Buttons</text>

    <!-- Color Palette Swatches -->
    <text x="25" y="90" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">PRIMARY COLORS</text>
    <circle cx="40" cy="118" r="15" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="85" cy="118" r="15" fill="#38bdf8" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="130" cy="118" r="15" fill="#2dd4bf" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="175" cy="118" r="15" fill="#818cf8" stroke="#a5b4fc" stroke-width="1.5"/>
    <circle cx="220" cy="118" r="15" fill="#020813" stroke="#334155" stroke-width="1.5"/>

    <!-- Typography Hierarchy -->
    <text x="25" y="170" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">TYPOGRAPHY</text>
    <text x="25" y="200" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">Heading 1 / Bold</text>
    <text x="25" y="225" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="16" font-weight="600">Heading 2 / Semibold</text>
    <text x="25" y="248" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">Body Regular Text (15px/140%)</text>
    <text x="25" y="268" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Caption / Mono Token</text>

    <!-- UI Component States -->
    <text x="25" y="315" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">BUTTON COMPONENTS</text>
    <rect x="25" y="335" width="120" height="34" rx="8" fill="url(#purpleCyan)"/>
    <text x="85" y="357" fill="#020813" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Primary Active</text>

    <rect x="160" y="335" width="120" height="34" rx="8" fill="#041a33" stroke="#0284c7" stroke-width="1.5"/>
    <text x="220" y="357" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Secondary</text>

    <rect x="25" y="385" width="255" height="36" rx="8" fill="#020c1a" stroke="#0e375e" stroke-width="1"/>
    <circle cx="45" cy="403" r="8" fill="#10b981"/>
    <text x="65" y="407" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="12">Interactive Switch / Active</text>
    <rect x="220" y="393" width="40" height="20" rx="10" fill="#10b981"/>
    <circle cx="248" cy="403" r="7" fill="#ffffff"/>

    <!-- User Experience Metric -->
    <rect x="25" y="440" width="255" height="50" rx="10" fill="#031224" stroke="#164e85" stroke-width="1"/>
    <text x="40" y="462" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">WCAG AAA Accessibility</text>
    <text x="40" y="478" fill="#34d399" font-family="'Outfit', sans-serif" font-size="11">Contrast Ratio 7.2:1 Verified</text>
  </g>
</svg>
